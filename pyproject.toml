[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "spectral-denoising"
version = "0.4.2"
description = "Spectral denoising and denoising search"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "Fanzhou Kong", email = "fzkong@ucdavis.edu"}
]
license = {file = "LICENSE"}
keywords = ["python", "metabolomics", "MSMS denoise"]
requires-python = ">=3.8,<3.13"
dependencies = [
    "chemparse>=0.3.1",
    "CIRpy>=1.0.2",
    "fuzzywuzzy>=0.18.0",
    "matplotlib>=3.9.2",
    "molmass>=2021.6.18",
    "ms_entropy>=1.3.3",
    "numexpr>=2.10.1",
    "numpy>=2.1.1",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "PubChemPy>=1.0.4",
    "rdkit==2024.3.5",
    "Requests>=2.32.3",
    "scikit_learn>=1.5.2",
    "scipy>=1.14.1",
    "seaborn>=0.13.2",
    "tqdm>=4.66.5",
    "python-Levenshtein>=0.26.1",
]

[tool.flit.module]
name = "spectral_denoising"
